<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <title>Create Меню</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      backdrop-filter: blur(6px);
      background-color: rgba(0, 0, 0, 0.4);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .menu {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
      width: 300px;
      text-align: center;
    }

    .menu h2 {
      margin-top: 0;
    }

    .create-btn {
      margin: 50px;
      padding: 15px 30px;
      font-size: 18px;
      cursor: pointer;
    }

    .close-btn {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #f44336;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

  </style>
</head>
<body>

  <button class="create-btn" onclick="openMenu()">Create</button>

  <div class="overlay" id="overlay">
    <div class="menu">
      <h2>Създай нещо ново</h2>
      <p>Тук може да добавиш форма, линкове, каквото пожелаеш.</p>
      <button class="close-btn" onclick="closeMenu()">Затвори</button>
    </div>
  </div>

  <script>
    function openMenu() {
      document.getElementById('overlay').style.display = 'flex';
    }

    function closeMenu() {
      document.getElementById('overlay').style.display = 'none';
    }
  </script>

</body>
</html>
